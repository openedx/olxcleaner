[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "olxcleaner"
dynamic = ["version"]
description = "Tool to scan Open edX courses for various errors"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Jolyon Bloomfield", email = "jolyon@mit.edu"}]
requires-python = ">=3.11"
keywords = ["edx"]
classifiers = [
    "Intended Audience :: Education",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "lxml",
    "python-dateutil",
    "pytz",
    "pylatexenc",
]

[project.urls]
Homepage = "https://github.com/openedx/olxcleaner"

[project.scripts]
edx-cleaner = "olxcleaner.entries.edxcleaner:main"
edx-reporter = "olxcleaner.entries.edxreporter:main"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.semantic_release]
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["olxcleaner*"]
exclude = ["*tests*"]

[tool.coverage.run]
branch = false
source = ["olxcleaner"]
omit = ["olxcleaner/entries/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError",
    "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[dependency-groups]
test = ["pytest", "pytest-cov"]
quality = [
    {include-group = "test"},
    "build",
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
    "twine",
]
doc = [
    {include-group = "test"},
    "build",
    "doc8",
    "sphinx",
    "sphinx-book-theme",
    "twine",
]
ci = ["tox", "tox-uv>=1"]
dev = [
    {include-group = "quality"},
    {include-group = "doc"},
    {include-group = "ci"},
    "diff-cover",
]

[tool.edx_lint]
uv_constraints = []

[tool.uv]
package = true
default-groups = []
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
]
